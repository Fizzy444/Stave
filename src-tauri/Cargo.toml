[package]
name = "stave"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.4"
image = { version = "0.25.10", features = ["webp"] }
rayon = "1.12.0"
walkdir = "2.5.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-global-shortcut = "2.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
zip = "8.6.0"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process"] }
tauri-plugin-dialog = "2"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.8"
open = "5.4.4"
tauri-plugin-updater = "2.13.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
